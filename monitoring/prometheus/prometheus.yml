global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus-python-app"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:8000"]
        labels:
          environment: "sandbox"
          app: "prometheus-python-reference"

  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
