global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'devops-blackhole'

receivers:
  - name: 'devops-blackhole'
    # In production, configure slack_configs, pagerduty_configs, or webhook_configs here
    webhook_configs: []
