apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-python-app
  namespace: monitoring-apps
  labels:
    app.kubernetes.io/name: prometheus-python-app
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-python-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
