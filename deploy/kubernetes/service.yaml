apiVersion: v1
kind: Service
metadata:
  name: prometheus-python-app
  namespace: monitoring-apps
  labels:
    app.kubernetes.io/name: prometheus-python-app
    app.kubernetes.io/part-of: client-python
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: prometheus-python-app
