apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-python-app
  namespace: monitoring-apps
  labels:
    app.kubernetes.io/name: prometheus-python-app
    app.kubernetes.io/part-of: client-python
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-python-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-python-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prometheus-python-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/melvinjosec/client_python:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prometheus-python-config
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp/metrics"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: multiproc-metrics
              mountPath: /tmp/metrics
      volumes:
        - name: multiproc-metrics
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
